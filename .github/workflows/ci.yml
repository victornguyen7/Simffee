# AUDIT_FIX_PLAN phase 4 (#10, #11, #12). Every job runs without provider credentials:
# the engine replays the committed cache/, and the tests stub every model call.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]     # README promises 3.11+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (unit, security, validation, and the script-style suites)
        run: python -m pytest -q

  demo:
    name: Demo replay, determinism, bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Stubbed end-to-end pipeline
        run: python tools/check_pipeline.py --out "$RUNNER_TEMP/pipeline"
      - name: Determinism and fork fairness (complete runs only)
        run: ./tools/check_determinism.sh
      - name: Every scenario, bundle or not, replays complete from cache/ (#27)
        run: >-
          python -m engine.cli --all --include-all --seeds 0-2 --offline --cache-defaults
          --require-complete --quiet --out "$RUNNER_TEMP/all-scenarios"
      - name: Rebuild the demo bundle offline from cache/
        run: ./tools/build_demo.sh --out "$RUNNER_TEMP/demo"
      - name: Committed public/runs.json matches the rebuild
        run: python tools/check_bundle.py "$RUNNER_TEMP/demo/runs.json"
      - name: Relative Markdown links resolve
        run: python tools/check_links.py

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
